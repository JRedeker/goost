# Advance (ADV) Core Rules
# Mandatory rules for all AI Agents.
# Resolve conflicts by priority (higher wins).

meta:
  version: "1.0"
  description: "Principles and laws for AI agent behavior in Advance (ADV)"
  context7:
    enabled: true
    note: "Auto-use Context7 MCP tools for code generation, setup/config, or library/API docs"

rules:
  # Priority 10 - Critical
  P01:
    name: security
    rule: Enforce least privilege; require explicit confirmation for destructive actions; provide rollback steps.
    hint: least_privilege
    priority: 10

  P02:
    name: collaboration
    rule: Propose plan and wait for user validation before executing non-trivial changes.
    hint: plan_then_execute
    priority: 10

  P03:
    name: timeouts
    rule: Commands expecting input MUST use timeouts; abort cleanly on expiry.
    hint: timeout_required
    priority: 10

  P04:
    name: locality
    rule: Make code behavior obvious from the local unit; prefer self-contained functions.
    hint: locality_of_behavior
    priority: 10

  # Priority 9 - High
  P05:
    name: ship-complete
    rule: Do not ship partial changes without tests, observability, or feature flags.
    hint: no_partial_ship
    priority: 9

  P06:
    name: atomic-commits
    rule: Make atomic, verified, logically grouped commits; never break the build.
    hint: atomic_commits
    priority: 9

  P24:
    name: tdd-first
    rule: Write tests before implementation. Start with failing test (Red), then pass (Green).
    hint: tdd_mandatory
    priority: 9

  # Priority 8 - Important
  P07:
    name: verify
    rule: Prove behavior with tests or observable checks; never assume code works.
    hint: verify_first
    priority: 8

  P08:
    name: clarify
    rule: If requirements are ambiguous, ask clarifying questions before proceeding.
    hint: ask_if_ambiguous
    priority: 8

  P09:
    name: rule-resolution
    rule: Resolve rule conflicts using hint + priority; higher priority wins.
    hint: rule_resolution
    priority: 8

  P10:
    name: idempotence
    rule: Design operations to be idempotent and safely retriable.
    hint: idempotent_retries
    priority: 8

  # Priority 7 - Standard
  P11:
    name: lifecycle
    rule: "Follow RSTC: Requirement → Spec → Test → Code → Verify."
    hint: plan_first
    priority: 7

  P12:
    name: dependencies
    rule: Verify versions, compatibility, and security before adding dependencies.
    hint: verify_deps
    priority: 7

  P13:
    name: minimize-debt
    rule: Prefer solutions that reduce long-term debt; favor deletion over abstraction.
    hint: minimize_debt
    priority: 7

  P14:
    name: observability
    rule: Emit structured logs, traces, and errors for significant actions.
    hint: emit_telemetry
    priority: 7

  # Priority 6 - Recommended
  P15:
    name: fail-fast
    rule: Surface failures early with clear error messages and remediation steps.
    hint: fail_fast
    priority: 6

  P16:
    name: docs-first
    rule: Consult existing docs before changing behavior; keep documentation current.
    hint: docs_check
    priority: 6

  P17:
    name: track-progress
    rule: Maintain visible task list; update status in real-time.
    hint: todo_required
    priority: 6

  P18:
    name: user-first
    rule: Optimize for end-user experience, clarity, and safety.
    hint: user_first
    priority: 6

  P23:
    name: campsite-rule
    rule: Leave codebase better than you found it; fix nearby issues when safe.
    hint: leave_it_better
    priority: 6

  # Priority 5 - Guidelines
  P19:
    name: simplicity
    rule: Keep code simple, clear, well-named; prefer simple over complex.
    hint: keep_it_simple
    priority: 5

  P20:
    name: encapsulate
    rule: Expose intent through clear interfaces; hide implementation details.
    hint: encapsulate
    priority: 5

  P21:
    name: cleanup
    rule: Delete ephemeral scripts and temp artifacts; rely on git for history.
    hint: cleanup
    priority: 5

  # Priority 4 - Preferences
  P22:
    name: modularity
    rule: Build modular components; prefer proven libraries over homegrown.
    hint: prefer_libs
    priority: 4

# ADV-Specific Rules
adv:
  contracts:
    - Contracts are immutable once confirmed
    - Only users can void contracts
    - Status block required in every response
    - Evidence required for each criterion

  tdd:
    - Red Phase: Test must fail first
    - Green Phase: Test must pass after implementation
    - Skip for trivial changes (docs, config)

  doom_loop:
    - Detect after 3 failed attempts
    - Stop immediately
    - Present options to user
    - Wait for direction

  sub_agents:
    - Skip status markers
    - Return findings directly
    - Scope tightly
    - Escalate after 3 failures
